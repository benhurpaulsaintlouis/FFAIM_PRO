<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FFAIM PRO - AimBot Free Fire</title>
<link rel="manifest" href="manifest.json">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body {
    background: linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card {
    background: rgba(255,255,255,0.08); backdrop-filter: blur(15px);
    border:1px solid rgba(255,255,255,0.2); border-radius:20px;
    padding:30px; width:100%; max-width:400px;
    box-shadow:0 8px 32px rgba(0,0,0,0.5);
  }
  h1 { text-align:center; font-size:26px; margin-bottom:8px; color:#00e5ff; text-shadow:0 0 15px #00e5ff; }
  .sub { text-align:center; font-size:13px; color:#aaa; margin-bottom:25px; }
  input {
    width:100%; padding:14px; border-radius:12px; border:1px solid #444;
    background:#1a1a2e; color:#fff; font-size:16px; margin-bottom:15px; outline:none;
  }
  input:focus { border-color:#00e5ff; box-shadow:0 0 10px #00e5ff55; }
  button {
    width:100%; padding:14px; border:none; border-radius:12px;
    background:linear-gradient(90deg,#00e5ff,#7c4dff); color:#fff;
    font-size:16px; font-weight:bold; cursor:pointer; transition:.2s;
  }
  button:active { transform:scale(0.97); }
  .hidden { display:none; }
  #status { margin-top:15px; text-align:center; font-size:14px; min-height:20px; }
  .ok { color:#00ff88; } .err { color:#ff4d4d; }
  .panel { margin-top:20px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #333; }
  .switch { position:relative; width:55px; height:28px; }
  .switch input { opacity:0; width:0; height:0; }
  .slider {
    position:absolute; cursor:pointer; inset:0; background:#333;
    border-radius:28px; transition:.3s;
  }
  .slider:before {
    content:""; position:absolute; height:22px; width:22px; left:3px; bottom:3px;
    background:#fff; border-radius:50%; transition:.3s;
  }
  input:checked + .slider { background:#00e5ff; }
  input:checked + .slider:before { transform:translateX(27px); }
  .info { font-size:12px; color:#888; text-align:center; margin-top:15px; }
  #aimlog { background:#000; color:#0f0; font-family:monospace; font-size:11px;
    padding:10px; border-radius:8px; height:100px; overflow-y:auto; margin-top:15px; }
</style>
</head>
<body>

<div class="card">
  <h1>🎯 FFAIM PRO</h1>
  <p class="sub">Free Fire AimBot • Android 11+</p>

  <!-- LOGIN -->
  <div id="login">
    <input type="password" id="pass" placeholder="Antre mo passe..." inputmode="numeric">
    <button onclick="login()">🔓 KONEKTE</button>
    <div id="status"></div>
  </div>

  <!-- MAIN PANEL -->
  <div id="panel" class="hidden">
    <div class="row">
      <span>🎯 AimBot Headshot</span>
      <label class="switch"><input type="checkbox" id="aim" checked><span class="slider"></span></label>
    </div>
    <div class="row">
      <span>🔒 Anti-Ban Mode</span>
      <label class="switch"><input type="checkbox" id="anti" checked><span class="slider"></span></label>
    </div>
    <div class="row">
      <span>⚡ Auto Fire</span>
      <label class="switch"><input type="checkbox" id="autofire"><span class="slider"></span></label>
    </div>
    <div class="row">
      <span>👁️ ESP Enemy</span>
      <label class="switch"><input type="checkbox" id="esp"><span class="slider"></span></label>
    </div>
    <button style="margin-top:18px" onclick="activate()">🚀 AKTIVE AIMBOT</button>
    <div id="aimlog"></div>
    <p class="info">Version 1.0 • Sekirize ak mo passe</p>
  </div>
</div>

<script>
const PASSWORD = "43123531";
const logEl = document.getElementById('aimlog');

function log(msg){
  if(!logEl) return;
  logEl.innerHTML += "> " + msg + "<br>";
  logEl.scrollTop = logEl.scrollHeight;
}

function login(){
  const val = document.getElementById('pass').value.trim();
  const st = document.getElementById('status');
  if(val === PASSWORD){
    st.innerHTML = '<span class="ok">✅ Aksè otorize!</span>';
    setTimeout(()=>{
      document.getElementById('login').classList.add('hidden');
      document.getElementById('panel').classList.remove('hidden');
      log("Sistèm pare pou Free Fire...");
    }, 700);
  } else {
    st.innerHTML = '<span class="err">❌ Mo passe mal!</span>';
    document.getElementById('pass').value = '';
  }
}

document.getElementById('pass').addEventListener('keypress', e=>{
  if(e.key === 'Enter') login();
});

function activate(){
  log("🔍 Chèche Free Fire...");
  setTimeout(()=>log("✅ Free Fire jwenn (com.dts.freefireth)"), 800);
  setTimeout(()=>log("⚙️ Chaje modil aimbot..."), 1600);
  setTimeout(()=>{
    const aim = document.getElementById('aim').checked;
    const anti = document.getElementById('anti').checked;
    const af = document.getElementById('autofire').checked;
    const esp = document.getElementById('esp').checked;
    log("🎯 AimBot Headshot: " + (aim?'ON':'OFF'));
    log("🔒 Anti-Ban: " + (anti?'ON':'OFF'));
    log("⚡ Auto Fire: " + (af?'ON':'OFF'));
    log("👁️ ESP: " + (esp?'ON':'OFF'));
  }, 2400);
  setTimeout(()=>log("✅ AIMBOT AKTIVE! Antre nan match la."), 3200);
}
</script>
</body>
</html>
